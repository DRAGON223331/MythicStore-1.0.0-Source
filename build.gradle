plugins {
    id 'java'
}

group = 'net.gawharasmp'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    // The target server supplies Paper at runtime.
    compileOnly 'io.papermc.paper:paper-api:26.3.build.+'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

jar {
    archiveBaseName = 'MythicStore'
}
